aid: bentolabs-ai
name: Bentolabs AI
description: >-
  Bentolabs AI builds Bento, a self-learning production infrastructure platform
  for AI agents. Bento ingests OpenTelemetry traces from agent applications and
  turns them into readable trajectories, plain-English failure-mode detectors
  (signals), alerts, clusters, evaluations, and versioned improvements — a
  closed loop that monitors what runs, surfaces silent regressions and
  behavioral drift, and compounds learnings back into the agent. It ships a
  Python SDK, a command-line client, direct OTLP export from any
  OpenTelemetry-speaking framework (LangChain, LlamaIndex, Mastra, Vercel AI
  SDK, Google ADK), a hosted MCP server, and packaged Agent Skills for AI coding
  tools. Y Combinator-backed.
