- name: BentoLabsApiKey
  type: apiKey
  description: >-
    Publishable ingest API key used by the SDK/exporter to ship OpenTelemetry
    traces to the BentoLabs ingest API. Keys begin with the `bl_pk_` prefix and
    the SDK validates the prefix locally before any network request.
  key_prefix: bl_pk_
  env_var: BENTOLABS_API_KEY
  init: bento.init(api_key="bl_pk_...")
  sources: [docs]
- name: BentoLabsUserAuth
  type: interactive
  description: >-
    The `bentolabs` CLI authenticates the human user via `bentolabs auth login`
    (personal credentials, full dashboard parity) rather than an API key. API
    keys are managed per workspace (see `bentolabs api-keys`).
  sources: [docs]
